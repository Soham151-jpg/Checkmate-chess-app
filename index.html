<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkmate — Play chess online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="overrides.css" />
    <link rel="stylesheet" href="coordinates.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#"><span class="brand-mark">♞</span>CHECKMATE</a>
        <div class="online-pill"><i></i> 2,841 players online</div>
        <button class="icon-button" id="soundButton" aria-label="Toggle sound">♬</button>
      </header>

      <section class="game-layout">
        <section class="table-wrap" aria-label="Chess game">
          <div class="player-card opponent">
            <div class="avatar amber" id="opponentAvatar">AI</div><div><strong id="opponentName">Chess AI</strong><span id="opponentMeta">Adaptive opponent</span></div>
            <div class="clock" id="blackClock">10:00</div>
          </div>
          <div class="board-frame"><div class="board" id="board" role="grid" aria-label="Chessboard"></div></div>
          <div class="player-card">
            <div class="avatar mint">YOU</div><div><strong>You</strong><span>1,497 rating</span></div>
            <div class="clock active-clock" id="whiteClock">10:00</div>
          </div>
        </section>

        <aside class="side-panel">
          <div class="game-header"><div><p class="eyebrow" id="gameType">VS AI • 10 MIN</p><h1 id="gameTitle">1v1 Chess</h1></div><button class="more" aria-label="Game options">•••</button></div>
          <div class="mode-switch" role="group" aria-label="Game mode"><button class="mode active" data-mode="ai">Vs AI</button><button class="mode" data-mode="local">2 players</button></div>
          <div class="status-card"><span class="turn-dot"></span><div><strong id="statusTitle">Your move</strong><p id="statusDetail">White to play</p></div></div>
          <div class="moves-section"><div class="section-label"><span>MOVE HISTORY</span><button id="undoButton">UNDO</button></div><ol class="moves" id="moveList"></ol></div>
          <div class="actions"><button class="secondary" id="newGameButton">New game</button><button class="primary" id="resignButton">Resign</button></div>
          <p class="hint" id="hint">You are White. The AI plays Black.</p>
        </aside>
      </section>
    </main>
    <div class="modal-backdrop hidden" id="modal"><div class="modal"><p class="eyebrow">GAME OVER</p><h2 id="modalTitle">Checkmate</h2><p id="modalText"></p><button class="primary" id="playAgain">Play again</button></div></div>
    <script src="app.js"></script>
  </body>
</html>
